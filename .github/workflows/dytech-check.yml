name: Dytech quick check (Dart)
run-name: "Dytech quick check ${{ github.ref_name }} - run #${{ github.run_number }}"

# Catches Dart compile errors in a few minutes, before the 40-minute Windows build.
# Runs automatically on every push to a build* branch (and can be started by hand).
on:
  push:
    branches: ["build*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  analyze:
    name: Analyze Dytech Dart files
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Analyze (errors fail the check)
        working-directory: flutter
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/desktop/pages/install_page.dart \
            lib/desktop/pages/desktop_home_page.dart \
            lib/desktop/pages/desktop_setting_page.dart \
            lib/desktop/widgets/dytech_console.dart \
            lib/desktop/widgets/dytech_quick.dart \
            lib/desktop/widgets/dytech_activate.dart
